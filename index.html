<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link
      id="favicon-light"
      rel="icon"
      type="image/svg+xml"
      href="%BASE_URL%branding/favicon-light.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      id="favicon-dark"
      rel="icon"
      type="image/svg+xml"
      href="%BASE_URL%branding/favicon-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jetmir Grubi is a senior software engineer in West New York, New Jersey, building .NET platforms, React products, and payment and healthcare systems."
    />
    <meta name="theme-color" content="#080B12" />
    <title>Jetmir Grubi | Senior Software Engineer</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Jetmir Grubi",
        "jobTitle": "Senior Software Engineer",
        "email": "mirigrubi8@gmail.com",
        "telephone": "+1-516-727-1440",
        "url": "https://www.linkedin.com/in/jetmir-grubi-741316447",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "430 52nd St, Apt 207",
          "addressLocality": "West New York",
          "addressRegion": "NJ",
          "postalCode": "07093",
          "addressCountry": "United States"
        },
        "sameAs": ["https://www.linkedin.com/in/jetmir-grubi-741316447"]
      }
    </script>
    <script>
      try {
        var stored = localStorage.getItem("theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "light" ? "#F4F6FB" : "#080B12");
        var lightIcon = document.getElementById("favicon-light");
        var darkIcon = document.getElementById("favicon-dark");
        if (lightIcon) lightIcon.media = theme === "light" ? "all" : "not all";
        if (darkIcon) darkIcon.media = theme === "dark" ? "all" : "not all";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/react-app/main.tsx"></script>
  </body>
</html>
